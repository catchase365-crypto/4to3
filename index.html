<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>正方体真布尔切割与拆解动画</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        #btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #ff5722;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,87,34,0.4);
            transition: background 0.3s, transform 0.1s;
        }
        #btn:hover {
            background-color: #f4511e;
        }
        #btn:active {
            transform: translateX(-50%) scale(0.95);
        }
    </style>
    <!-- 引入 Three.js 及 CSG 布尔运算库 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
                "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js",
                "three-csg-ts": "https://esm.sh/three-csg-ts@3.2.0"
            }
        }
    </script>
</head>
<body>
    <div id="info">提示：点击任意三角体或下方按钮，查看正方体真布尔切割与拆解动画</div>
    <button id="btn">点击拆开 / 合拢</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
        import { CSG } from 'three-csg-ts';

        // 1. 基础场景搭建
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 网格辅助
        const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
        gridHelper.position.y = -1.5;
        scene.add(gridHelper);

        // 辅助函数：生成四面体切刀几何体
        function createTetrahedralGeometry(p0, p1, p2, p3) {
            const geom = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                p0.x, p0.y, p0.z,  p1.x, p1.y, p1.z,  p2.x, p2.y, p2.z,
                p0.x, p0.y, p0.z,  p2.x, p2.y, p2.z,  p3.x, p3.y, p3.z,
                p0.x, p0.y, p0.z,  p3.x, p3.y, p3.z,  p1.x, p1.y, p1.z,
                p1.x, p1.y, p1.z,  p3.x, p3.y, p3.z,  p2.x, p2.y, p2.z,
            ]);
            geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geom.computeVertexNormals();
            return geom;
        }

        // 2. 真正的几何切割运算 (CSG Boolean Subtraction)
        // 创建一个初始的完整正方体 (边长 2, 中心在原点)
        const cubeGeo = new THREE.BoxGeometry(2, 2, 2);
        const cubeMesh = new THREE.Mesh(cubeGeo);
        cubeMesh.updateMatrix();

        // 定义 4 个角的切刀配置
        const corners = [
            { tip: new THREE.Vector3(-1, -1, -1), v1: new THREE.Vector3(-1, -1, 1), v2: new THREE.Vector3(-1, 1, -1), v3: new THREE.Vector3(1, -1, -1), color: 0xff4d4d, dir: new THREE.Vector3(-1, -1, -1) },
            { tip: new THREE.Vector3( 1,  1, -1), v1: new THREE.Vector3( 1,  1,  1), v2: new THREE.Vector3( 1, -1, -1), v3: new THREE.Vector3(-1,  1, -1), color: 0x4da6ff, dir: new THREE.Vector3( 1,  1, -1) },
            { tip: new THREE.Vector3( 1, -1,  1), v1: new THREE.Vector3( 1, -1, -1), v2: new THREE.Vector3( 1,  1,  1), v3: new THREE.Vector3(-1, -1,  1), color: 0x5cd65c, dir: new THREE.Vector3( 1, -1,  1) },
            { tip: new THREE.Vector3(-1,  1,  1), v1: new THREE.Vector3(-1,  1, -1), v2: new THREE.Vector3(-1, -1,  1), v3: new THREE.Vector3( 1,  1,  1), color: 0xffd11a, dir: new THREE.Vector3(-1,  1,  1) }
        ];

        let csgCube = CSG.fromMesh(cubeMesh);
        const animationData = [];
        const movableGroup = new THREE.Group();
        scene.add(movableGroup);

        const interactableObjects = [];

        // 循环执行真实的布尔减法运算
        corners.forEach((c) => {
            const cutterGeo = createTetrahedralGeometry(c.tip, c.v1, c.v2, c.v3);
            const cutterMesh = new THREE.Mesh(cutterGeo);
            cutterMesh.updateMatrix();

            // 从正方体中减去该切刀部分（布尔运算）
            csgCube = csgCube.subtract(CSG.fromMesh(cutterMesh));

            // 创建外围切下来的可视化三角体
            const mat = new THREE.MeshStandardMaterial({
                color: c.color,
                roughness: 0.3,
                metalness: 0.2,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.88
            });
            const partMesh = new THREE.Mesh(cutterGeo, mat);
            
            // 黑色网格边框
            const wire = new THREE.LineSegments(
                new THREE.WireframeGeometry(cutterGeo),
                new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 })
            );
            partMesh.add(wire);

            movableGroup.add(partMesh);
            interactableObjects.push(partMesh);

            const offsetDir = c.dir.clone().normalize();
            animationData.push({
                mesh: partMesh,
                closedPos: new THREE.Vector3(0, 0, 0),
                openedPos: offsetDir.multiplyScalar(0.9) // 散开间隙
            });
        });

        // 3. 提取布尔运算后真正剩下的中心核心体
        const coreGeo = CSG.toGeometry(csgCube, cubeMesh.matrix);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0xeeeeee,
            roughness: 0.2,
            metalness: 0.4,
            side: THREE.DoubleSide
        });
        const innerCore = new THREE.Mesh(coreGeo, coreMat);
        
        const coreWire = new THREE.LineSegments(
            new THREE.WireframeGeometry(coreGeo),
            new THREE.LineBasicMaterial({ color: 0x333333 })
        );
        innerCore.add(coreWire);
        movableGroup.add(innerCore); // 核心保持原位不动

        // 4. 动画与交互逻辑
        let isOpened = false;
        const progress = { value: 0 };

        function updatePositions(val) {
            animationData.forEach(item => {
                item.mesh.position.lerpVectors(item.closedPos, item.openedPos, val);
            });
        }

        function toggleAnimation() {
            const targetVal = isOpened ? 0 : 1;
            new TWEEN.Tween(progress)
                .to({ value: targetVal }, 800)
                .easing(TWEEN.Easing.Cubic.Out)
                .onUpdate(() => {
                    updatePositions(progress.value);
                })
                .start();
            isOpened = !isOpened;
            document.getElementById('btn').innerText = isOpened ? "点击合拢" : "点击拆开";
        }

        document.getElementById('btn').addEventListener('click', toggleAnimation);

        // 点击三角体触发动画
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.id === 'btn') return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);
            if (intersects.length > 0) {
                toggleAnimation();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
